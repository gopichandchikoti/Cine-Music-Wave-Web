<!doctype html>
<html lang="<%- content.locale %>" dir="<%- content.direction %>">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111917" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="<%- content.document.description %>" />
    <% if (apiOrigin) { %><link rel="preconnect" href="<%- apiOrigin %>" crossorigin /><% } %>
    <title><%- content.document.title %></title>
  </head>
  <body>
    <div id="root"></div>
    <noscript><%- content.document.noScript %></noscript>
  </body>
</html>
